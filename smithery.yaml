# Smithery configuration for Transparência (CGU)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_transparencia

name: transparencia-mcp
displayName: "Transparência (CGU)"
description: >
  Consulta no Portal da Transparência do Governo Federal: sanções (CEIS, CNEP, CEPIM) e Pessoas Expostas Politicamente (PEP) por CPF/CNPJ para due diligence e compliance, e despesas recebidas por favorecido (quanto uma empresa recebeu da União, por órgão e por mês, com os documentos de empenho/liquidação/pagamento). Cobre o Executivo Federal. Hospedado pela plataforma; sem credencial do usuário.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/transparencia-mcp
repository: https://github.com/mcp-dir/transparencia-mcp

tags:
  - transparencia
  - brazil
  - med
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_transparencia

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_transparencia/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
